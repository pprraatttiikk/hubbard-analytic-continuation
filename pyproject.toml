[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbard-ac"
version = "0.1.0"
description = "Physics-informed machine learning for analytic continuation in the 1D Hubbard model"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
ml = [
    "torch",
]

dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
